name: Build Kirin970 K414

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-20
          fetch-depth: 1

      - name: GetTime
        run: echo "NOW=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev \
            libelf-dev device-tree-compiler python3 git curl wget xz-utils zip \
            gcc-10-aarch64-linux-gnu

      - name: Show toolchain
        run: |
          uname -a
          aarch64-linux-gnu-gcc-10 --version | head -1
          python3 --version

      - name: Patch known GCC10+ breakages
        run: |
          set -e
          echo "=== fix 1: block/blk.h elevator_exit self-recursion ==="
          grep -n 'elevator_exit' block/blk.h | head -10 || true
          sed -i 's/^\([[:space:]]*\)elevator_exit(q, e);[[:space:]]*$/\1__elevator_exit(q, e);/' block/blk.h
          grep -n 'elevator_exit' block/blk.h | head -10 || true

          echo "=== fix 2: fs/f2fs/sdp.h const int array size ==="
          grep -n 'RESERVED_DATA_LEN' fs/f2fs/sdp.h | head -10 || true
          sed -i 's/static const int RESERVED_DATA_LEN = 8;/#define RESERVED_DATA_LEN 8/' fs/f2fs/sdp.h
          grep -n 'RESERVED_DATA_LEN' fs/f2fs/sdp.h | head -10 || true

          echo "=== fix 3: strip hardcoded -Werror from every Makefile ==="
          grep -rl -- '-Werror' --include=Makefile --include='Kbuild' . > /tmp/werror.txt || true
          wc -l /tmp/werror.txt || true
          cat /tmp/werror.txt || true
          while read -r f; do sed -i 's/\(^\|[[:space:]]\)-Werror\([[:space:]]\|\$\)/\1\2/g' "$f"; done < /tmp/werror.txt
          grep -rn -- '-Werror' --include=Makefile --include='Kbuild' . | head -5 || true
          echo "remaining -Werror count: $(grep -rn -- '-Werror' --include=Makefile --include='Kbuild' . | wc -l)"

          echo "=== fix 4: allow C99 in huawei lcdkit subtree ==="
          echo 'subdir-ccflags-y += -std=gnu99' >> drivers/devkit/lcdkit/lcdkit1.0/Makefile
          cat drivers/devkit/lcdkit/lcdkit1.0/Makefile

          echo "=== fix 5: disable WERROR kconfig ==="
          chmod +x scripts/config 2>/dev/null || true
          ./scripts/config --file arch/arm64/configs/merge_kirin970_defconfig -d WERROR || true

          echo "=== fix 6: ufshcd_scsi_to_upiu_lun bare inline -> extern ==="
          grep -n 'ufshcd_scsi_to_upiu_lun' drivers/scsi/ufs/ufshcd.h || true
          grep -n 'ufshcd_scsi_to_upiu_lun' drivers/scsi/ufs/ufshcd.c | head -3 || true
          sed -i 's|^inline u8 ufshcd_scsi_to_upiu_lun(unsigned int scsi_lun);|extern u8 ufshcd_scsi_to_upiu_lun(unsigned int scsi_lun);|' drivers/scsi/ufs/ufshcd.h
          sed -i 's|^inline u8 ufshcd_scsi_to_upiu_lun(unsigned int scsi_lun)$|u8 ufshcd_scsi_to_upiu_lun(unsigned int scsi_lun)|' drivers/scsi/ufs/ufshcd.c
          grep -n 'ufshcd_scsi_to_upiu_lun' drivers/scsi/ufs/ufshcd.h || true
          grep -n 'ufshcd_scsi_to_upiu_lun' drivers/scsi/ufs/ufshcd.c | head -3 || true

      - name: Diagnose stack protector support
        run: |
          set +e
          CC=aarch64-linux-gnu-gcc-10
          echo "--- gcc version ---"; $CC --version | head -2
          echo "--- print-file-name=include ---"; $CC -print-file-name=include
          echo "--- bare stackp test ---"
          echo 'void foo(void){}' > /tmp/t.c
          $CC -fstack-protector-strong -c /tmp/t.c -o /tmp/t.o; echo "bare_rc=$?"
          echo "--- cc-option style test (as kernel Makefile does) ---"
          $CC -D__KERNEL__ -fstack-protector-strong -Werror -O2 -nostdinc \
              -isystem "$($CC -print-file-name=include)" -c -x c /dev/null -o /tmp/t2.o
          echo "ccoption_rc=$?"
          echo "--- defconfig stackp entries ---"
          grep -n 'CC_STACKPROTECTOR' arch/arm64/configs/merge_kirin970_defconfig || true

      - name: Fallback relax stack protector
        run: |
          set -e
          chmod +x scripts/config 2>/dev/null || true
          ./scripts/config --file arch/arm64/configs/merge_kirin970_defconfig \
            -d CC_STACKPROTECTOR_STRONG -d CC_STACKPROTECTOR_REGULAR -e CC_STACKPROTECTOR_NONE || true
          grep -n 'CC_STACKPROTECTOR' arch/arm64/configs/merge_kirin970_defconfig || true

      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc-10
          mkdir -p ../out
          export KCFLAGS="-w -Wno-error"
          make ARCH=arm64 O=../out HOSTCFLAGS="-fcommon -w" merge_kirin970_defconfig
          make ARCH=arm64 O=../out HOSTCFLAGS="-fcommon -w" CC=aarch64-linux-gnu-gcc-10 -j$(nproc --all)

      - name: Show result
        if: always()
        run: |
          ls -la ../out/arch/arm64/boot/ 2>/dev/null || echo "no boot dir"

      - name: Pack artifacts
        if: always()
        run: |
          mkdir -p dist/ko
          cp ../out/arch/arm64/boot/Image.gz dist/ 2>/dev/null || true
          cp ../out/arch/arm64/boot/Image dist/ 2>/dev/null || true
          cp ../out/.config dist/kernel_config.txt 2>/dev/null || true
          find ../out -name '*.ko' -exec cp {} dist/ko/ \; 2>/dev/null || true
          ls -la dist dist/ko | head -60

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kirin970_K414_${{ env.NOW }}
          path: dist/
          if-no-files-found: warn
